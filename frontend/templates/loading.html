<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>最適化処理中 - Menu Optimizer</title>
    <link rel="stylesheet" href="static/assets/css/loading.css">
</head>
<body>
    <div class="loading-container">
        <!-- フリップカードの構造 -->
        <div class="flip-card">
            <div class="flip-card-inner">
                <!-- 表面：最適化中の表示 -->
                <div class="flip-card-front">
                    <div class="loading-card">
                        <div class="spinner"></div>
                        <h2>メニューを最適化中...</h2>
                        <p>この処理には数秒~数分かかる場合があります</p>
                        
                        <!-- 最適化完了後に表示されるボタン -->
                        <button id="resultButton" class="result-button" disabled>
                            結果を見る →
                        </button>
                    </div>
                </div>
                <!-- 裏面：最適化コードの表示（例としての文字列） -->
                <div class="flip-card-back">
                    <div class="loading-card">
                        <h2>Optimization code </h2>
                         <!-- 固定サイズのコード表示コンテナ -->
        <div class="code-container">
            <pre id="codeDisplay"><!-- 読み込んだコードが表示される --></pre>
        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="static/assets/js/loading.js" type="module"></script>
</body>
</html>
