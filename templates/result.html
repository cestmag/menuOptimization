<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Neo Food Gallery</title>
    <script src="static/js/result.js" type="module"></script>
    <link rel="stylesheet" href="static/css/result.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ヘッダー: 店舗名、モード、合計金額を表示 -->
    <div id="result-header" class="result-header"></div>
    <!-- プラン選択ボタン用 -->
    <div id="trial-buttons" class="trial-buttons"></div>
    <!-- 結果表示用コンテナ -->
    <div id="container"></div>

    <!-- 戻るボタン -->
    <div class="back-button-container">
      <button id="backButton" class="back-button">
          <span class="button-icon">←</span>
          <span class="button-text">TOPに戻る</span>
          <span class="button-glow"></span>
      </button>
    </div>
</body>
</html>
