<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Food Optimizer - Mode Selection</title>
    <script src="static/js/index.js" type="module"></script>
  <!--  <link rel="stylesheet" href="assets/css/main.css">-->
    <link rel="stylesheet" href="static/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
 
</head>
<body>
    <div class="main-container">
        <div class="mode-selection-card">
            <div class="title-section">
                <h1 class="main-title">Menu Optimizer</h1>
                <!-- 追加コンポーネント1: URL入力テキストボックス -->
             <!-- メニュー選択セレクトボックス -->
             <div class="menu-selection-container">
                <select id="menuSelect" class="menu-select">
                    <option value="">選択してください</option><!--スクレイピングで動的にやってもいいけどあんまめりっとかんじん-->
                   
                <!--   <option value="https://west2-univ.jp/sp/menu.php?t=663251">メニュー1</option>
                    <option value="https://example.com/menu2">メニュー2</option>
                    <option value="https://example.com/menu3">メニュー3</option>
                    <option value="https://example.com/menu4">メニュー4</option>
                    <option value="https://example.com/menu5">メニュー5</option> -->
                </select>
            </div>
            <!-- 追加コンポーネント2: URL遷移ボタン -->
            <button class="url-button" id="visitUrlButton">
                メニューサイトを開く
            </button>
                <p>最適化モードを選択してください</p>
            </div>

            <div class="mode-options">
                <!-- モード選択オプション -->
                <div class="radio-item">
                    <input type="radio" id="mode1" name="optimizeMode" value="normal">
                    <label class="radio-label" for="mode1">
                        <span class="custom-radio"></span>
                        <div>
                            <div>通常モード</div>
                            <small>普通が一番</small>
                        </div>
                    </label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="mode2" name="optimizeMode" value="tanpaku">
                    <label class="radio-label" for="mode2">
                        <span class="custom-radio"></span>
                        <div>
                            <div>タンパク質モード</div>
                            <small>タンパク質たくさんとるど</small>
                        </div>
                    </label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="mode3" name="optimizeMode" value="karori">
                    <label class="radio-label" for="mode3">
                        <span class="custom-radio"></span>
                        <div>
                            <div>カロリーモード</div>
                            <small>カロリーなんて気にしない♪</small>
                        </div>
                    </label>
                </div>
            </div>

           <!-- <button class="submit-button" onclick="handleSubmit()">-->
                <button class="submit-button" id="submitButton">    
                メニュー最適化開始 →
            </button>
        </div>
    </div>

  
</body>
</html>
